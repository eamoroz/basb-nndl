<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Decision Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: Arial; padding: 40px; background: #f5f5f5; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; }
        .positive { color: green; }
        .negative { color: red; }
        .neutral { color: orange; }
        .action-box { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<h1>AI Decision Engine</h1>

<div class="card">
    <button id="analyze-btn">Analyze Random Review</button>
    <p id="review-text">Click button to analyze</p>
    <p id="sentiment-result">Sentiment will appear here</p>
    <div id="action-box" class="action-box"></div>
    <div id="error-message" style="color:red;"></div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
