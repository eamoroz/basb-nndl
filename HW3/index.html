<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Decision Engine</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Papa Parse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        button {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .review-card {
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .review-card h3 {
            margin-bottom: 10px;
        }

        .review-text {
            line-height: 1.6;
            color: #444;
        }

        .sentiment-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }

        .positive {
            color: #28a745;
            border: 2px solid #28a745;
        }

        .negative {
            color: #dc3545;
            border: 2px solid #dc3545;
        }

        .neutral {
            color: #ffc107;
            border: 2px solid #ffc107;
        }

        .action-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            font-size: 16px;
            font-weight: 600;
        }

        .coupon {
            background: #ffe6e6;
            border: 2px solid #dc3545;
            color: #dc3545;
        }

        .upsell {
            background: #e6f7ff;
            border: 2px solid #007bff;
            color: #007bff;
        }

        .no-action {
            background: #fff8e1;
            border: 2px solid #ffc107;
            color: #b8860b;
        }

        .error {
            margin-top: 15px;
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>AI Decision Engine</h1>

    <button id="analyze-btn">
        <i class="fas fa-robot"></i> Analyze Random Review
    </button>

    <div class="review-card">
        <h3>Selected Review:</h3>
        <p id="review-text" class="review-text">
            Click the button above to analyze a random review
        </p>

        <div id="sentiment-result" class="sentiment-result">
            Sentiment will appear here
        </div>

        <div id="action-box" class="action-box"></div>

        <div id="error-message" class="error"></div>
    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
